services:
  backend:
    build: ./
    ports:
      - 5000:5000
    networks:
      - mongonode-network
    environment:
      - MONGODB_URI=mongodb://admin:password@mongo:27017
    depends_on:
      - mongo
  mongo:
    image: mongo:8.3.8
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27017:27017
    volumes:
      - mongoData:/data/db
    networks:
      - mongonode-network
volumes:
  mongoData:
networks:
  mongonode-network:
    driver: bridge
